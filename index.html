<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iron Tide: Shore Leave</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root{
    --bg-deep:#171423;
    --panel:#241f38;
    --panel-edge:#4a3f6b;
    --gold:#e8c15e;
    --teal:#5fd8c9;
    --danger:#e0596b;
    --success:#7bd66a;
    --text:#e9e4f0;
    --dim:#9a91b8;
  }
  *{box-sizing:border-box;image-rendering:pixelated;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg-deep); font-family:'VT323', monospace; color:var(--text);
    padding:20px;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }

  .game{
    width:100%; max-width:720px; border:4px solid var(--panel-edge);
    background:var(--panel); box-shadow:0 0 0 4px var(--bg-deep), 0 12px 30px rgba(0,0,0,.5);
  }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-bottom:4px solid var(--panel-edge);
    font-size:12px; letter-spacing:.5px;
  }
  .topbar .title{ color:var(--gold); }
  .topbar .tracker{ color:var(--teal); font-size:10px; }
  .topbar .linkbtn{
    background:none; border:none; color:var(--dim); font-family:'Press Start 2P';
    font-size:9px; cursor:pointer; text-decoration:underline;
  }
  .topbar .linkbtn:hover{ color:var(--gold); }

  .scene-art{
    position:relative; width:100%; aspect-ratio: 16/9;
    background:repeating-linear-gradient(45deg,#2b2545,#2b2545 10px,#241f38 10px,#241f38 20px);
    display:flex; align-items:center; justify-content:center;
    border-bottom:4px solid var(--panel-edge);
    overflow:hidden;
  }
  .scene-art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .scene-art .placeholder-label{
    font-family:'Press Start 2P'; font-size:9px; color:var(--dim); text-align:center; padding:0 20px;
  }

  .dialogue{
    display:flex; gap:12px; padding:14px; border-bottom:4px solid var(--panel-edge);
    min-height:110px;
  }
  .portrait{
    position:relative;
    flex:0 0 64px; width:64px; height:64px; border:3px solid var(--panel-edge);
    background:#332b52; display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P'; font-size:8px; color:var(--dim); text-align:center;
    overflow:visible;
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; }
  .portrait.player{ border-color:var(--teal); }
  .portrait.npc{ border-color:var(--gold); }
  .portrait.narrator{ border-color:var(--dim); }

  .jail-badge{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%; background:var(--bg-deep);
    border:2px solid var(--danger); display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; z-index:3;
  }
  .jail-badge .jcount{
    position:absolute; bottom:-6px; right:-6px; background:var(--danger); color:#2a0f14;
    font-family:'Press Start 2P'; font-size:7px; border-radius:50%; width:13px; height:13px;
    display:flex; align-items:center; justify-content:center;
  }

  /* --- procedural placeholder animation (no image files needed) --- */
  .orc-demo{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#241f38; }
  .orc-face{
    width:70%; height:78%; background:#5c8a4a; border-radius:40% 40% 46% 46%;
    position:relative; transform-origin:center bottom;
    animation:orcBreathe 2.2s ease-in-out infinite;
  }
  .orc-nostril{
    position:absolute; bottom:24%; width:6px; height:6px; background:#1f2a17; border-radius:50%;
    animation:orcFlare 2.2s ease-in-out infinite;
  }
  .orc-nostril.left{ left:30%; }
  .orc-nostril.right{ right:30%; }
  @keyframes orcBreathe{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(1.07); } }
  @keyframes orcFlare{ 0%,38%,100%{ transform:scale(1); } 50%{ transform:scale(1.8); } }

  .speech{ flex:1; }
  .speaker-name{ font-family:'Press Start 2P'; font-size:11px; margin-bottom:6px; }
  .speaker-name.npc{ color:var(--gold); }
  .speaker-name.player{ color:var(--teal); }
  .speaker-name.narrator{ color:var(--dim); }
  .speech-text{ font-size:20px; line-height:1.35; }

  .choices{ padding:10px 14px 16px; display:flex; flex-direction:column; gap:8px; }
  .choice-btn{
    text-align:left; background:#332b52; border:3px solid var(--panel-edge);
    color:var(--text); font-family:'VT323'; font-size:19px; padding:9px 12px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .choice-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .choice-btn:disabled{ opacity:.4; cursor:default; }
  .choice-btn:disabled:hover{ border-color:var(--panel-edge); color:var(--text); }
  .choice-btn.choice-unlocked{ color:var(--teal); border-color:#3a6b63; }
  .choice-btn.choice-unlocked:hover{ border-color:var(--gold); color:var(--gold); }
  .choice-btn .tag{
    font-family:'Press Start 2P'; font-size:8px; color:var(--danger); margin-left:10px; white-space:nowrap;
  }
  .choice-btn .status{
    font-family:'Press Start 2P'; font-size:8px; color:var(--success); margin-left:10px; white-space:nowrap;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(10,8,20,.75);
    display:flex; align-items:center; justify-content:center; z-index:10;
  }
  .roll-card{
    background:var(--panel); border:4px solid var(--gold); padding:26px 30px;
    text-align:center; width:280px;
  }
  .roll-card h3{ font-family:'Press Start 2P'; font-size:12px; color:var(--gold); margin:0 0 14px; }
  .die{
    font-family:'Press Start 2P'; font-size:34px; color:var(--text); margin:10px 0;
    min-height:48px;
  }
  .roll-math{ font-size:18px; color:var(--dim); margin-bottom:14px; }
  .roll-btn{
    font-family:'Press Start 2P'; font-size:11px; background:var(--teal); color:#161327;
    border:none; padding:10px 18px; cursor:pointer;
  }
  .roll-btn:disabled{ background:#4a3f6b; color:var(--dim); cursor:default; }
  .roll-result{ font-family:'Press Start 2P'; font-size:13px; margin-top:12px; }
  .roll-result.success{ color:var(--success); }
  .roll-result.fail{ color:var(--danger); }

  .mod-row{ display:flex; justify-content:center; gap:10px; align-items:center; margin-bottom:6px; font-size:16px; }
  .mod-row input{
    width:46px; font-family:'VT323'; font-size:18px; text-align:center;
    background:#332b52; color:var(--text); border:2px solid var(--panel-edge);
  }

  /* --- character select --- */
  .char-select{ padding:20px; }
  .char-select h2{
    font-family:'Press Start 2P'; font-size:14px; color:var(--gold);
    text-align:center; margin:0 0 4px;
  }
  .char-select .sub{ text-align:center; color:var(--dim); font-size:16px; margin-bottom:18px; }
  .char-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
  }
  @media (max-width:480px){
    .char-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .char-card{
    background:#332b52; border:3px solid var(--panel-edge); padding:10px 8px;
    text-align:center; cursor:pointer;
  }
  .char-card:hover{ border-color:var(--gold); }
  .char-card.dm-card{ border-color:#5a4f7a; opacity:.75; }
  .char-card.dm-card:hover{ border-color:var(--dim); opacity:1; }
  .char-card .cportrait{
    position:relative;
    width:100%; aspect-ratio:1; border:2px solid var(--panel-edge); margin-bottom:8px;
    display:flex; align-items:center; justify-content:center; overflow:visible;
    font-family:'Press Start 2P'; font-size:8px; color:var(--dim); background:#241f38;
  }
  .char-card .cportrait img{ width:100%; height:100%; object-fit:cover; }
  .char-card .cname{ font-family:'Press Start 2P'; font-size:11px; color:var(--text); margin-bottom:6px; }
  .char-card .cblurb{ font-size:14px; color:var(--dim); min-height:34px; }
  .char-card .ctags{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:6px; }
  .char-card .ctag{
    font-family:'Press Start 2P'; font-size:7px; color:#161327; background:var(--teal);
    padding:3px 5px;
  }

  /* --- title screen --- */
  .title-screen{ padding:50px 24px; text-align:center; }
  .title-screen .logo{
    font-family:'Press Start 2P'; font-size:28px; color:var(--gold); line-height:1.5;
    text-shadow:3px 3px 0 var(--bg-deep);
  }
  .title-screen .tagline{ font-family:'Press Start 2P'; font-size:11px; color:var(--teal); margin:10px 0 14px; }
  .title-screen .flavor{ font-size:18px; color:var(--dim); margin-bottom:36px; }
  .title-screen .beginbtn{
    font-family:'Press Start 2P'; font-size:13px; background:var(--gold); color:#161327;
    border:none; padding:14px 26px; cursor:pointer;
  }
  .title-screen .beginbtn:hover{ background:var(--teal); }
  .title-screen .logbtn{
    display:block; margin:18px auto 0; background:none; border:none; cursor:pointer;
    font-family:'VT323'; font-size:17px; color:var(--dim); text-decoration:underline;
  }
  .title-screen .logbtn:hover{ color:var(--gold); }

  /* --- dm gate (nonsense riddle) --- */
  .gate-screen{ padding:40px 24px; text-align:center; }
  .gate-screen h2{ font-family:'Press Start 2P'; font-size:13px; color:var(--gold); margin-bottom:24px; }
  .gate-screen .riddle{ font-size:22px; margin-bottom:26px; line-height:1.4; }
  .gate-screen .secret-dot{ cursor:default; padding:0 4px; }
  .gate-answers{ display:flex; flex-direction:column; gap:10px; max-width:340px; margin:0 auto; }
  .gate-msg{ margin-top:18px; color:var(--dim); font-size:16px; min-height:20px; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .shake{ animation:shake .25s; }

  /* --- dm settings --- */
  .dm-screen{ padding:20px; }
  .dm-screen h2{ font-family:'Press Start 2P'; font-size:13px; color:var(--gold); margin:0 0 4px; }
  .dm-section{ margin-top:22px; }
  .dm-section h3{ font-family:'Press Start 2P'; font-size:10px; color:var(--teal); margin-bottom:10px; }
  .stat-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-bottom:10px; font-size:17px; }
  .stat-row .sname{ width:100%; flex-shrink:0; }
  .stat-row label{ font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  .stat-row input{
    width:50px; font-family:'VT323'; font-size:16px; text-align:center;
    background:#332b52; color:var(--text); border:2px solid var(--panel-edge);
  }
  .progress-card{
    background:#332b52; border:3px solid var(--panel-edge); padding:10px 12px; margin-bottom:10px; font-size:16px;
  }
  .progress-card .pname{ font-family:'Press Start 2P'; font-size:11px; color:var(--gold); margin-bottom:6px; }
  .progress-card .pline{ color:var(--dim); margin-bottom:2px; }
  .resetbtn{
    margin-top:8px; font-family:'Press Start 2P'; font-size:8px; background:var(--danger); color:#2a0f14;
    border:none; padding:7px 10px; cursor:pointer;
  }
  .note-item{ background:#332b52; border:3px solid var(--panel-edge); padding:8px 10px; margin-bottom:8px; }
  .note-item .ndate{ font-family:'Press Start 2P'; font-size:9px; color:var(--teal); margin-bottom:4px; }
  .note-item .ntext{ font-size:17px; white-space:pre-wrap; }
  .note-form{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .note-form input[type=date]{ background:#332b52; color:var(--text); border:2px solid var(--panel-edge); font-family:'VT323'; font-size:15px; padding:4px; }
  .note-form textarea{
    background:#332b52; color:var(--text); border:2px solid var(--panel-edge);
    font-family:'VT323'; font-size:17px; padding:6px; resize:vertical; min-height:60px;
  }
  .note-form button{
    align-self:flex-start; font-family:'Press Start 2P'; font-size:9px; background:var(--success);
    color:#0f2a13; border:none; padding:8px 12px; cursor:pointer;
  }
  .adv-item{ background:#332b52; border:3px solid var(--panel-edge); padding:8px 10px; margin-bottom:8px; }
  .adv-item .aname{ font-family:'Press Start 2P'; font-size:11px; color:var(--gold); margin-bottom:4px; }
  .adv-item .abuilt{ color:var(--dim); font-size:14px; }
  .adv-form{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .adv-form input[type=text]{
    background:#332b52; color:var(--text); border:2px solid var(--panel-edge);
    font-family:'VT323'; font-size:17px; padding:6px;
  }
  .adv-form textarea{
    background:#1c1830; color:var(--text); border:2px solid var(--panel-edge);
    font-family:monospace; font-size:13px; padding:8px; resize:vertical; min-height:160px;
  }
  .adv-form select{
    background:#332b52; color:var(--text); border:2px solid var(--panel-edge);
    font-family:'VT323'; font-size:17px; padding:6px;
  }
  .adv-form label.adv-label{ color:var(--dim); font-size:14px; }
  .adv-hint{ color:var(--dim); font-size:14px; line-height:1.4; }
  .adv-hint code{ background:#1c1830; color:var(--teal); padding:1px 4px; font-family:monospace; }
  .adv-error{ color:var(--danger); font-size:15px; min-height:18px; }
  .delbtn{
    float:right; background:none; border:none; color:var(--danger); font-family:'Press Start 2P'; font-size:8px; cursor:pointer;
  }
  .backbtn{
    margin-top:20px; font-family:'Press Start 2P'; font-size:9px; background:#332b52; color:var(--text);
    border:3px solid var(--panel-edge); padding:9px 14px; cursor:pointer;
  }
  .backbtn:hover{ border-color:var(--gold); }

  .music-toggle{
    position:fixed; top:10px; right:10px; z-index:50;
    background:var(--panel); border:3px solid var(--panel-edge); color:var(--text);
    font-size:16px; width:40px; height:40px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .music-toggle:hover{ border-color:var(--gold); }
</style>
</head>
<body>

<div class="game" id="game"></div>

<script>
/* ============================================================
   1. ASSET SLOTS
   Drop your own 8-bit PNGs in an /images folder next to this
   file and put the filename here. Anything left blank shows a
   placeholder box with a label so you always know what's missing.

   ANIMATION: give a portrait an array of 2-4 filenames instead of
   one string and it loops through them (about 2.5 frames/sec) —
   e.g. brakka: ["images/brakka_1.png","images/brakka_2.png","images/brakka_3.png"]
   Brakka currently has no image files, so he shows a hand-built
   breathing + nostril-flare placeholder instead, as a working demo
   of the animation feature.
   ============================================================ */
const IMAGES = {
  backgrounds: {
    snapping_line_main: null, // e.g. "images/snapping_line.png"
    empty_net_main: null,     // e.g. "images/empty_net.png"
    wicker_goat_main: null,   // e.g. "images/wicker_goat.png"
    market_main: null,        // e.g. "images/market_row.png"
    stocks: null,             // e.g. "images/town_stocks.png"
  },
  portraits: {
    // the DM — shown on the character select "Dungeon Master" card,
    // and as the speaker portrait for every narrator line in-game
    dm: null,                // e.g. "images/dm.jpg"
    // player presets
    ash: ["images/ash1.jpg"],
    nyx: ["images/nyx1.jpg", "images/nyx1.jpg", "images/nyx1.jpg", "images/nyx3.jpg", "images/nyx2.jpg", "images/nyx3.jpg"],
    timmy: ["images/timmy1.jpg"],
    brakka: ["images/brakka1.jpg", "images/brakka1.jpg", "images/brakka1.jpg", "images/brakka2.jpg", "images/brakka2.jpg", "images/brakka1.jpg", "images/brakka2.jpg", "images/brakka1.jpg", "images/brakka3.jpg"],
    durgon: ["images/durgon1.jpg"],
    // NPCs — Snapping Line
    hanna: null,
    pike: null,
    squint: null,
    // NPCs — Empty Net
    kreb: null,
    ressa: null,
    shivver: null,
    // NPCs — Wicker Goat
    lankus: null,
    torvin: null,
    corley: null,
    // reserved for whenever Market gets its own story
    merchant: null,
  }
};

/* ============================================================
   1b. AUDIO
   Same idea as IMAGES: drop an audio file path in, leave null for
   silence — nothing plays until you add real files. "menu" loops on
   every screen EXCEPT a location scene or the jail/stocks screen.
   Each entry under "backgrounds" loops for as long as a location
   scene showing that background is on screen — keyed by the exact
   same background key used in IMAGES.backgrounds and in each node's
   "background" field, so a DM-posted adventure that reuses an
   existing background key (e.g. "market_main") automatically gets
   that background's music too, no extra wiring needed. A background
   key with no matching entry here just plays silently.
   ============================================================ */
const AUDIO = {
  menu: null,                 // e.g. "audio/menu_theme.mp3"
  backgrounds: {
    snapping_line_main: null, // e.g. "audio/snapping_line_ambience.mp3"
    empty_net_main: null,
    wicker_goat_main: null,
    market_main: null,
    stocks: null,
  }
};

/* ============================================================
   1c. CHARACTER PRESETS
   These live-edit from the in-game DM settings screen (no code
   editing needed once you're testing), but you can also just
   change the starting numbers here.
   ============================================================ */
const PRESETS = {
  ash:    { name: "Ash",    blurb: "Silver-tongued and quick to smile.",         portrait: "ash",    stats: { Str: 0,  Dex: 2,  Con: 0, Int: 1,  Wis: 1, Cha: 4 }, startingGold: 0 },
  nyx:    { name: "Nyx",    blurb: "Moves like smoke, speaks rarely.",           portrait: "nyx",    stats: { Str: -1, Dex: 4,  Con: 0, Int: 1,  Wis: 2, Cha: 0 }, startingGold: 0 },
  timmy:  { name: "Timmy",  blurb: "Earnest, a little clumsy, easy to trust.",   portrait: "timmy",  stats: { Str: 0,  Dex: -1, Con: 1, Int: 0,  Wis: 1, Cha: 2 }, startingGold: 0 },
  brakka: { name: "Brakka", blurb: "Built like a door, twice as hard to move.",  portrait: "brakka", stats: { Str: 4,  Dex: -1, Con: 3, Int: -1, Wis: 0, Cha: 0 }, startingGold: 0 },
  durgon: { name: "Durgon", blurb: "Commanding presence, charm to match.",       portrait: "durgon", stats: { Str: 3,  Dex: 0,  Con: 2, Int: 1,  Wis: 0, Cha: 3 }, startingGold: 0 }
};
const SKILL_LIST = ["Str", "Dex", "Con", "Int", "Wis", "Cha"];

/* ============================================================
   1d. CAMPAIGN NOTES
   Added from the DM settings screen. Players see these
   read-only from the "Campaign Notes" link on the hub screen.
   ============================================================ */
let NOTES = [
  {
    date: "2026-07-04",
    text: "Session Recap: The Escape from the Salt Stacks\n\nThe party began their adventure in the infamous Salt Stacks, a cavernous island prison known for its harsh reputation, no one leaves the stacks alive.\n\nFortunately, they soon found some unlikely allies in Captain Stormbeard and his dubious crew. Together, they faced the challenges of the prison break, causing enough chaos to not only escape, but also reclaim some much-needed equipment and loot from the Guard Captain's quarters.\n\nAlong the way, they discovered something, or rather someone, far more interesting: a mysterious prisoner sealed behind iron, wearing an ominous iron mask and mad with rage. Against all better judgement, they decided to free him.\n\nWith the prison in chaos, the party and Stormbeard's crew made their escape. They managed to land a direct hit on the pursuing guard ship, crippling it and ensuring no one would be following them anytime soon.\n\nUnfortunately, their own ship was damaged in the battle.\n\nAlready battered from the escape, it took on far too much damage and was taking on too much water. With no choice but to abandon ship, the party scrambled to the ships Jolly Boats and rowed off into the night.\n\nThey may have lost their vessel, but they escaped the Salt Stacks with their lives, set free a potentially dangerous criminal, and made a few questionable new friends."
  }
];

/* ============================================================
   2. LOCATIONS
   Node-graph scenes — the actual dialogue/choice content for an
   adventure. A choice's "next" can point to another node, OR to
   one of two special values:
     "__COMPLETE__"  -> ends the visit, marks this adventure done
     "__JAIL__"      -> ends the visit in the stocks

   This is the framework with the story content stripped out,
   left with ONE small worked example demonstrating every
   mechanic so far: a GROUP adventure ("Night on the Town",
   containing one location, "tavern_stop") and a chained LOCATION
   adventure ("Visit the Market") that requires the group cleared
   first, with a choice gated behind an ally, an item/gold effect,
   and a point-of-no-return node. Copy this pattern to build real
   adventures in code, or post new ones from DM Settings without
   touching code at all — see BUILTIN_ADVENTURES below for how
   groups vs. single-location adventures are declared.
   ============================================================ */
const LOCATIONS = {

  snapping_line: {
    name: "The Snapping Line",
    start: "start",
    nodes: {
      start: {
        background: "snapping_line_main",
        speaker: { name: "Narrator", type: "narrator" },
        text: "The Snapping Line is built from the bones of half a dozen retired fishing boats, and it hasn't forgotten. The smell of old catch is baked into the planks. Dice rattle in one corner; behind the bar, a woman with rolled sleeves and a sharp eye keeps watch over the room — Hanna Rist, by the look of the family resemblance to half the lobster boats in the harbor.",
        choices: [
          { text: "Talk to Hanna Rist", next: "hanna_intro", branchKey: "hanna" },
          { text: "Listen in on the dockhands", next: "dockhands_intro" },
          { text: "Join the dice game", next: "dice_intro" },
          { text: "Try your luck lifting a purse", next: "pickpocket_intro" },
          { text: "Leave for the night", next: "__COMPLETE__" }
        ]
      },
      hanna_intro: {
        background: "snapping_line_main",
        speaker: { name: "Hanna Rist", type: "npc", portrait: "hanna" },
        text: "\"New face. Sit if you like — just don't sit *there*, that stool's held together by spite. Can I get you something? Fair warning, my family's claw wine has a reputation, and it's not a good one.\"",
        noReturn: true,
        choices: [
          { text: "Try the claw wine", next: "hanna_wine" },
          { text: "Ask about her family's fishing business", next: "hanna_family" },
          { text: "Just chat, no drink needed", next: "hanna_friendly" }
        ]
      },
      hanna_wine: {
        background: "snapping_line_main",

/* ============================================================
   2b. TOP-LEVEL ADVENTURE MENU
   After picking a character, players land on an adventure menu.
   Two adventure shapes:

     type: "group"    — a set of locations the player can complete
                         in ANY order (like a night of pub-hopping).
                         The group counts as cleared once every
                         location in its "locations" array is done.
                         Groups are declared here in code — the DM
                         Settings "post adventure" box only creates
                         single-location adventures for now.

     type: "location"  — a single node graph (see LOCATIONS above),
                          dropping straight into the location screen.
                          This is what DM Settings posts.

   Either type can have a "requires" field naming another
   adventure's key — it stays locked on the adventure menu until
   that one is cleared. Chain as many as you like.

   The DM can post additional "location" adventures from DM
   Settings and they land here too, alongside anything declared
   below — not nested inside a group unless you add them to a
   group's "locations" array here in code.
   ============================================================ */
const BUILTIN_ADVENTURES = [
  { key: "night_on_the_town", name: "Night on the Town", type: "group", locations: ["snapping_line", "empty_net", "wicker_goat"], town: "Saltmarsh" },
  { key: "market", name: "Visit the Market", type: "location", requires: "night_on_the_town", town: "Saltmarsh" }
];

let CUSTOM_LOCATIONS = {};
let CUSTOM_ORDER = [];
/* Set while the DM is editing a built-in location's node graph from
   DM Settings (rather than posting a brand new custom adventure). */
let editingBuiltinKey = null;

/* Reopens a location for every character without touching anything
   they've already earned there (allies/items/gold/consequences stay).
   Used when the DM edits a built-in location's content in place. */
function reopenLocationForEveryone(locKey){
  Object.keys(progress).forEach(charKey => {
    delete progress[charKey].completed[locKey];
    saveProgress(charKey);
  });
}

function topAdventures(){
  return [
    ...BUILTIN_ADVENTURES,
    ...CUSTOM_ORDER.map(key => ({
      key,
      name: CUSTOM_LOCATIONS[key].name,
      type: "location",
      requires: CUSTOM_LOCATIONS[key].requires || null,
      town: CUSTOM_LOCATIONS[key].town || null
    }))
  ];
}
/* Which town a location's rewards should be tagged with. Single-location
   adventures carry their own town; a group's member locations inherit
   the group's town (a group only ever lives in one town). */
function getTownForLocation(locKey){
  const direct = topAdventures().find(a => a.type === "location" && a.key === locKey);
  if (direct) return direct.town || null;
  const group = BUILTIN_ADVENTURES.find(a => a.type === "group" && (a.locations || []).includes(locKey));
  return group ? (group.town || null) : null;
}
/* The group (if any) a location belongs to — used when jail auto-completes
   every other unfinished location in the same group ("the night's over"). */
function getGroupForLocation(locKey){
  return BUILTIN_ADVENTURES.find(a => a.type === "group" && (a.locations || []).includes(locKey)) || null;
}
/* Every key whose completion is tracked individually via pr.completed[key] —
   every group's member locations, plus every single-location adventure
   (built-in or custom). Groups themselves are excluded since their
   "completion" is derived from their member locations, not stored directly. */
function allLocationKeys(){
  const keys = [];
  BUILTIN_ADVENTURES.forEach(adv => {
    if (adv.type === "group") keys.push(...(adv.locations || []));
    else keys.push(adv.key);
  });
  keys.push(...CUSTOM_ORDER);
  return keys;
}
/* True once an adventure (group or single location) is fully cleared. */
function isAdventureCleared(adv){
  if (!adv) return false;
  if (adv.type === "group") return (adv.locations || []).every(lk => progress[state.character].completed[lk]);
  return !!progress[state.character].completed[adv.key];
}
/* True once a character has cleared every adventure currently on the
   menu — every built-in and DM-posted one, with nothing left locked
   or incomplete. This is the trigger for the results/stats page. There
   must be at least one adventure to clear, so a character can't "finish
   the game" before anything exists to finish. */
function hasCompletedRun(charKey){
  const advs = topAdventures();
  if (!advs.length) return false;
  const pr = progress[charKey];
  if (!pr) return false;
  return advs.every(adv => {
    if (adv.type === "group") return (adv.locations || []).every(lk => pr.completed[lk]);
    return !!pr.completed[adv.key];
  });
}
/* True if an adventure's prerequisite (if any) hasn't been cleared yet. */
function adventureLocked(adv){
  if (!adv.requires) return false;
  const reqAdv = topAdventures().find(a => a.key === adv.requires);
  return !isAdventureCleared(reqAdv);
}
function getLocation(key){
  return LOCATIONS[key] || CUSTOM_LOCATIONS[key];
}
function slugify(name){
  let base = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  if (!base) base = "adventure";
  let candidate = base, n = 2;
  while (getLocation(candidate)) { candidate = `${base}_${n}`; n++; }
  return candidate;
}
/* Flat gold fine for a night in the stocks. Change this one number to
   retune it everywhere (jail screen text updates automatically). */
const JAIL_FINE = 50;

/* ============================================================
   3. ENGINE STATE
   Local objects (progress, LOCATIONS, CUSTOM_LOCATIONS, PRESETS
   stats, NOTES) stay the single source of truth for rendering —
   nothing about how the screens read data changes. When the "db"
   capability is available (this page is published with persistence
   turned on), every mutation is ALSO written through to the shared
   store below, and a set of subscriptions keep local state hydrated
   from it — on first load (pulling in whatever was saved before)
   and live, whenever another viewer changes something. Without db
   (previewing, or a plain downloaded copy of this file), every save
   call below silently no-ops and the game behaves exactly as it did
   before persistence existed — pure in-memory, per-tab only.
   ============================================================ */
function freshProgress(charKey){
  // Gold tracks the NET change for the session — it's meant to reconcile
  // against each player's real character sheet at the table, not model an
  // absolute wallet, so it's allowed to go negative. It starts wherever
  // that character's "starting gold" is set (DM Settings → Party Stats),
  // 0 by default.
  const start = (PRESETS[charKey] && typeof PRESETS[charKey].startingGold === "number") ? PRESETS[charKey].startingGold : 0;
  return { completed: {}, jailed: false, jailCount: 0, allies: [], consequences: [], items: [], info: [], gold: start };
}
let progress = {};
Object.keys(PRESETS).forEach(k => progress[k] = freshProgress(k));

/* ---------- PERSISTENCE (db capability) ---------- */
let DB = null;

async function initPersistence(){
  try {
    if (typeof window === "undefined" || !window.claude || typeof window.claude.use !== "function"){
      DB = null;
    } else {
      DB = await window.claude.use("db");
    }
  } catch (e){
    DB = null;
  }
  if (!DB) return; // no persistence available — stay fully in-memory, as before

  DB.collection("progress").onSnapshot(snap => {
    const seen = new Set();
    (snap.docs || []).forEach(d => {
      seen.add(d.id);
      progress[d.id] = normalizeProgress(d.data(), d.id);
    });
    // Seed a save doc for any preset character with nothing saved yet,
    // so it exists for next time and for other viewers.
    Object.keys(PRESETS).forEach(k => { if (!seen.has(k)) saveProgress(k); });
    render();
  }, () => {});

  DB.collection("customAdventures").onSnapshot(snap => {
    const newLocs = {}, newOrder = [];
    (snap.docs || []).forEach(d => { newLocs[d.id] = d.data(); newOrder.push(d.id); });
    CUSTOM_LOCATIONS = newLocs;
    CUSTOM_ORDER = newOrder;
    render();
  }, () => {});

  DB.collection("locationOverrides").onSnapshot(snap => {
    (snap.docs || []).forEach(d => { LOCATIONS[d.id] = d.data(); });
    render();
  }, () => {});

  DB.collection("partyStats").onSnapshot(snap => {
    (snap.docs || []).forEach(d => {
      if (!PRESETS[d.id]) return;
      const { startingGold, ...abilityStats } = d.data() || {};
      PRESETS[d.id].stats = { ...PRESETS[d.id].stats, ...abilityStats };
      if (typeof startingGold === "number") PRESETS[d.id].startingGold = startingGold;
    });
    render();
  }, () => {});

  DB.collection("notes").onSnapshot(snap => {
    NOTES = (snap.docs || []).map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => {});
}

/* Fills in any field a saved progress doc might be missing (e.g. an
   older save from before a new reward type existed) with fresh defaults. */
function normalizeProgress(data, charKey){
  return { ...freshProgress(charKey), ...(data || {}) };
}

function saveProgress(charKey){
  if (!DB || !progress[charKey]) return;
  DB.doc("progress/" + charKey).set(progress[charKey]).catch(() => {});
}
function saveCustomAdventure(key){
  if (!DB || !CUSTOM_LOCATIONS[key]) return;
  DB.doc("customAdventures/" + key).set(CUSTOM_LOCATIONS[key]).catch(() => {});
}
function deleteCustomAdventureRemote(key){
  if (!DB) return;
  DB.doc("customAdventures/" + key).delete().catch(() => {});
}
function saveLocationOverride(key){
  if (!DB || !LOCATIONS[key]) return;
  DB.doc("locationOverrides/" + key).set(LOCATIONS[key]).catch(() => {});
}
function savePartyStats(charKey){
  if (!DB || !PRESETS[charKey]) return;
  DB.doc("partyStats/" + charKey).set({ ...PRESETS[charKey].stats, startingGold: PRESETS[charKey].startingGold || 0 }).catch(() => {});
}
function saveNote(note){
  if (!DB) return;
  DB.doc("notes/" + note.id).set({ date: note.date, text: note.text }).catch(() => {});
}
function deleteNoteRemote(id){
  if (!DB) return;
  DB.doc("notes/" + id).delete().catch(() => {});
}

let state = {
  screen: "title",   // title | select | gate | dm | adventureSelect | groupSelect | notesView | location | jail
  character: null,
  locationKey: null,
  node: null
};

let portraitAnimTimer = null;

function bgTag(key){
  const src = IMAGES.backgrounds[key];
  if (src) return `<img src="${src}" alt="">`;
  return `<div class="placeholder-label">[Background image: ${key}<br>place file at IMAGES.backgrounds.${key}]</div>`;
}

/* Builds whatever goes INSIDE a portrait box, for a resolved portrait key.
   Supports three cases:
     - a single filename string -> plain static image
     - an array of 2-4 filenames -> loops through them (see wireAnimatedPortraits)
     - null, with no art yet -> placeholder text, except "brakka" gets a
       hand-built breathing/nostril-flare demo so you can see the animation
       feature working before you've drawn anything. */
function portraitInner(resolvedKey){
  const src = resolvedKey ? IMAGES.portraits[resolvedKey] : null;
  if (Array.isArray(src)) {
    return `<img class="anim-portrait" data-frames='${JSON.stringify(src)}' src="${src[0]}" alt="">`;
  }
  if (typeof src === "string") {
    return `<img src="${src}" alt="">`;
  }
  if (!src && resolvedKey === "brakka") {
    return `<div class="orc-demo"><div class="orc-face"><div class="orc-nostril left"></div><div class="orc-nostril right"></div></div></div>`;
  }
  return (resolvedKey || "NPC").slice(0,6).toUpperCase();
}
function portraitTag(key, type){
  const resolvedKey = type === "player" ? PRESETS[state.character].portrait : type === "narrator" ? "dm" : key;
  return portraitInner(resolvedKey);
}

/* Small badge that sits on the top rim of a player portrait once they've
   spent a night in the stocks. Shows a count bubble after the first time. */
function jailBadge(charKey){
  const pr = progress[charKey];
  if (!pr || !pr.jailCount) return "";
  const countHtml = pr.jailCount > 1 ? `<span class="jcount">${pr.jailCount}</span>` : "";
  return `<div class="jail-badge" title="Spent ${pr.jailCount} night(s) in the stocks">⛓${countHtml}</div>`;
}

/* Cycles any animated (array-based) portraits currently on screen.
   Re-run after every render since the DOM gets replaced each time. */
function wireAnimatedPortraits(el){
  if (portraitAnimTimer) clearInterval(portraitAnimTimer);
  const imgs = el.querySelectorAll("img.anim-portrait");
  if (!imgs.length) return;
  const tracked = Array.from(imgs).map(img => ({ img, frames: JSON.parse(img.dataset.frames), idx: 0 }));
  portraitAnimTimer = setInterval(() => {
    tracked.forEach(t => {
      t.idx = (t.idx + 1) % t.frames.length;
      t.img.src = t.frames[t.idx];
    });
  }, 400);
}

/* ---------- MUSIC ---------- */
let musicEl = null;
let currentTrackSrc = null;
let musicMuted = false;

/* What SHOULD be playing right now, based on the current screen —
   null means silence. A location scene uses its current node's
   background to look up ambience; the jail screen uses the stocks
   background the same way; everything else uses the menu theme. */
function desiredTrack(){
  if (state.screen === "location"){
    const loc = getLocation(state.locationKey);
    const n = loc && loc.nodes[state.node];
    return (n && AUDIO.backgrounds[n.background]) || null;
  }
  if (state.screen === "jail") return AUDIO.backgrounds.stocks || null;
  return AUDIO.menu || null;
}

/* Called at the end of every render(). Only touches the <audio>
   element when the desired track actually changes, and retries
   play() on every call while paused — covers the common case where
   the browser blocks the very first autoplay until a real click
   happens, without needing a separate "first interaction" listener. */
function syncMusic(){
  if (typeof Audio === "undefined") return; // no audio support in this environment
  const track = desiredTrack();
  if (!musicEl){
    musicEl = new Audio();
    musicEl.loop = true;
    musicEl.volume = 0.5;
  }
  if (!track){
    if (currentTrackSrc !== null){ musicEl.pause(); currentTrackSrc = null; }
    return;
  }
  const trackChanged = track !== currentTrackSrc;
  if (trackChanged){
    currentTrackSrc = track;
    musicEl.src = track;
  }
  musicEl.muted = musicMuted;
  if (trackChanged || musicEl.paused){
    musicEl.play().catch(() => { /* still blocked until a user gesture — next click retries */ });
  }
}

function setupMusicToggle(){
  if (typeof document === "undefined" || !document.body || !document.body.appendChild) return;
  const btn = document.createElement("button");
  btn.className = "music-toggle";
  btn.id = "musicToggleBtn";
  btn.textContent = "\u{1F50A}";
  btn.title = "Mute/unmute music";
  btn.addEventListener("click", () => {
    musicMuted = !musicMuted;
    btn.textContent = musicMuted ? "\u{1F507}" : "\u{1F50A}";
    if (musicEl){
      musicEl.muted = musicMuted;
      if (!musicMuted && musicEl.paused) musicEl.play().catch(() => {});
    }
  });
  document.body.appendChild(btn);
}

function render(){
  const el = document.getElementById("game");
  if (state.screen === "title") renderTitle(el);
  else if (state.screen === "select") renderCharacterSelect(el);
  else if (state.screen === "gate") renderGate(el);
  else if (state.screen === "dm") renderDMSettings(el);
  else if (state.screen === "adventureSelect" && state.character && hasCompletedRun(state.character)) renderResults(el);
  else if (state.screen === "adventureSelect") renderAdventureSelect(el);
  else if (state.screen === "groupSelect") renderGroupSelect(el);
  else if (state.screen === "notesView") renderNotesView(el);
  else if (state.screen === "jail") renderJail(el);
  else if (state.screen === "location") renderLocation(el);
  wireAnimatedPortraits(el);
  syncMusic();
}

  const customAdvHtml = CUSTOM_ORDER.map(key => {

    const reqAdv = loc.requires ? topAdventures().find(a => a.key === loc.requires) : null;
    return `
      <div class="adv-item">

  const notesList = [...NOTES].sort((a,b)=>b.date.localeCompare(a.date)).map((n,i) => `

      const id = btn.dataset.delnote;
      const idx = NOTES.findIndex(n => n.id === id);
      if (idx > -1) NOTES.splice(idx, 1);
      deleteNoteRemote(id);
      renderDMSettings(el);
    });
  });
  document.getElementById("addNoteBtn").addEventListener("click", () => {
    const date = document.getElementById("noteDate").value;
    const text = document.getElementById("noteText").value.trim();
    if (!date || !text) return;
    const note = { id: String(Date.now()) + Math.random().toString(36).slice(2, 7), date, text };
    NOTES.push(note);
    saveNote(note);
    renderDMSettings(el);
  });
  document.getElementById("dmBack").addEventListener("click", () => {
    state.screen = "title"; render();
  });
}

/* ---------- ADVENTURE SELECT (top-level menu) ---------- */
function renderAdventureSelect(el){
  const pr = progress[state.character];
  if (pr.jailed){ renderJail(el); return; }

  const cards = topAdventures().map(adv => {
    const locked = adventureLocked(adv);
    const townLabel = adv.town ? `<span style="color:var(--dim); font-size:14px;"> — ${adv.town}</span>` : "";
    if (adv.type === "group"){
      const total = (adv.locations || []).length;
      const done = (adv.locations || []).filter(lk => pr.completed[lk]).length;
      const tag = locked
        ? '<span class="status" style="color:var(--danger)">LOCKED</span>'
        : `<span class="status" style="color:var(--dim)">${done}/${total}</span>`;
      return `<button class="choice-btn" data-advkey="${adv.key}" data-type="group" ${locked ? "disabled" : ""}>
        ${adv.name}${townLabel}${tag}
      </button>`;
    }
    const done = pr.completed[adv.key];
    const tag = done
      ? '<span class="status">COMPLETED</span>'
      : locked ? '<span class="status" style="color:var(--danger)">LOCKED</span>' : "";
    return `<button class="choice-btn" data-advkey="${adv.key}" data-type="location" ${(done || locked) ? "disabled" : ""}>
      ${adv.name}${townLabel}${tag}
    </button>`;
  }).join("");

  el.innerHTML = `
    <div class="topbar">
      <span class="title pixel">IRON TIDE</span>
      <span class="tracker pixel">${PRESETS[state.character].name.toUpperCase()} · ALLIES ${pr.allies.length} · GOLD ${pr.gold}</span>
    </div>
    <div class="dialogue">
      <div class="portrait player">${portraitTag(null, "player")}${jailBadge(state.character)}</div>
      <div class="speech">
        <div class="speaker-name player">${PRESETS[state.character].name}</div>
        <div class="speech-text">Where to tonight?</div>
      </div>
    </div>
    <div class="choices">
      ${cards}
    </div>
    <div style="padding:0 14px 16px;">
      <button class="backbtn" id="advSelectBack">Back</button>
    </div>
  `;

  el.querySelectorAll("[data-advkey]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.advkey;
      if (btn.dataset.type === "group"){
        state.groupKey = key;
        state.screen = "groupSelect";
        render();
      } else {
        enterLocation(key, "adventureSelect");
      }
    });
  });
  document.getElementById("advSelectBack").addEventListener("click", () => {
    state.character = null; state.screen = "select"; render();
  });
}

    <div class="dialogue">
      <div class="portrait player">${portraitTag(null, "player")}${jailBadge(state.character)}</div>
      <div class="speech">
        <div class="speaker-name player">${charName}</div>
        <div class="speech-text">There's nothing left undone. Here's how it went.</div>
      </div>
    </div>
    <div class="dm-screen">
      <h2>${charName.toUpperCase()}'S STORY</h2>

      <div class="dm-section">
        <h3>ADVENTURES COMPLETED</h3>
        <div class="progress-card"><div class="pline">${completedNames.length ? completedNames.join(", ") : "None"}</div></div>
      </div>

      <div class="dm-section">
        <h3>ALLIES MADE</h3>

      </div>

      <div class="dm-section">
        <h3>ITEMS COLLECTED</h3>

      </div>

      <div class="dm-section">

        <h3>CONSEQUENCES</h3>
        <div class="progress-card"><div class="pline">${pr.consequences.length ? pr.consequences.join(", ") : "None"}</div></div>
      </div>

      <div class="dm-section">
        <h3>FINAL TALLY</h3>

  document.getElementById("resultsBack").addEventListener("click", () => {

/* ---------- GROUP SUB-MENU (e.g. Night on the Town) ---------- */
function renderGroupSelect(el){
  const pr = progress[state.character];
  if (pr.jailed){ renderJail(el); return; }
  const adv = topAdventures().find(a => a.key === state.groupKey);

  const cards = (adv.locations || []).map(key => {
    const loc = getLocation(key);
    const done = pr.completed[key];
    return `<button class="choice-btn" data-loc="${key}" ${done ? "disabled" : ""}>
      ${loc.name}
      ${done ? '<span class="status">COMPLETED</span>' : ""}
    </button>`;
  }).join("");

  el.innerHTML = `
    <div class="topbar">
      <span class="title pixel">${adv.name.toUpperCase()}</span>
      <span class="tracker pixel">${PRESETS[state.character].name.toUpperCase()} · ALLIES ${pr.allies.length} · GOLD ${pr.gold}</span>
    </div>
    <div class="dialogue">
      <div class="portrait player">${portraitTag(null, "player")}${jailBadge(state.character)}</div>
      <div class="speech">
        <div class="speaker-name player">${PRESETS[state.character].name}</div>
        <div class="speech-text">A few places to try tonight. Where to?</div>
      </div>
    </div>
    <div class="choices">
      ${cards}
    </div>
    <div style="padding:0 14px 16px;">
      <button class="backbtn" id="groupBack">Back</button>
    </div>
  `;

  el.querySelectorAll("[data-loc]").forEach(btn => {
    btn.addEventListener("click", () => {
      enterLocation(btn.dataset.loc, "groupSelect");
    });
  });
  document.getElementById("groupBack").addEventListener("click", () => {
    state.screen = "adventureSelect"; render();
  });
}

/* ---------- JAIL ---------- */
function renderJail(el){
  const pr = progress[state.character];
  el.innerHTML = `
    <div class="topbar">
      <span class="title pixel">IRON TIDE</span>
      <span class="tracker pixel">${PRESETS[state.character].name.toUpperCase()} · IN THE STOCKS</span>
    </div>
    <div class="scene-art">${bgTag("stocks")}</div>
    <div class="dialogue">
      <div class="portrait player">${portraitTag(null, "player")}${jailBadge(state.character)}</div>
      <div class="speech">
        <div class="speaker-name player">${PRESETS[state.character].name}</div>
        <div class="speech-text">Locked in the stocks. Pay to walk free tonight, or ride it out and call it a night.</div>
      </div>
    </div>
    <div class="choices">
      <button class="choice-btn" id="payBtn">Pay the ${JAIL_FINE} gold fine and go (free to try another pub)</button>
      <button class="choice-btn" id="stayBtn">Spend the night (the rest of tonight's pubs are done for)</button>
    </div>
  `;
  document.getElementById("payBtn").addEventListener("click", () => {
    pr.gold -= JAIL_FINE;
    pr.jailed = false;
    saveProgress(state.character);
    state.screen = "adventureSelect"; render();
  });
  document.getElementById("stayBtn").addEventListener("click", () => {
    const group = getGroupForLocation(state.lastJailedLocation);
    if (group){
      (group.locations || []).forEach(lk => { pr.completed[lk] = true; });
    }
    pr.jailed = false;
    saveProgress(state.character);
    state.screen = "adventureSelect"; render();
  });
}

/* ---------- CAMPAIGN NOTES (read-only) ---------- */
function renderNotesView(el){
  const notesList = [...NOTES].sort((a,b)=>b.date.localeCompare(a.date)).map(n => `
    <div class="note-item">
      <div class="ndate">${n.date}</div>
      <div class="ntext">${n.text}</div>
    </div>
  `).join("") || `<div class="pline" style="color:var(--dim)">No notes yet.</div>`;

  el.innerHTML = `
    <div class="topbar">
      <span class="title pixel">IRON TIDE</span>
      <span class="tracker pixel">SHIP'S LOG</span>
    </div>
    <div class="dm-screen">
      <h2>SHIP'S LOG</h2>
      ${notesList}
      <button class="backbtn" id="notesBack">Back</button>
    </div>
  `;
  document.getElementById("notesBack").addEventListener("click", () => {
    state.screen = state.notesReturnTo || "adventureSelect"; render();
  });
}

/* ---------- LOCATION (adventure scene) ---------- */
function meetsChoiceRequirement(choice, pr){
  if (!choice.requires) return true;
  const reqs = Array.isArray(choice.requires) ? choice.requires : [choice.requires];
  return reqs.every(req => {
    if (req.ally) return pr.allies.some(a => a.name === req.ally);
    if (req.consequence) return pr.consequences.includes(req.consequence);
    if (req.item) return pr.items.some(i => i.name === req.item);
    if (req.info) return pr.info.some(i => i.name === req.info);
    if (req.goldAtLeast != null) return pr.gold >= req.goldAtLeast;
    return true;
  });
}

function renderLocation(el){
  const pr = progress[state.character];
  const loc = getLocation(state.locationKey);
  const n = loc.nodes[state.node];
  const speakerType = n.speaker.type;
  const portraitHtml = `<div class="portrait ${speakerType}">${portraitTag(n.speaker.portrait, speakerType)}</div>`;

  const choicesHtml = n.choices
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => meetsChoiceRequirement(c, pr) && !(c.branchKey && state.visitedBranches.includes(c.branchKey)))
    .map(({ c, i }) => {
      const tag = c.skillCheck ? `<span class="tag">${c.skillCheck.skill} DC ${c.skillCheck.dc}</span>` : "";
      const unlockedClass = c.requires ? " choice-unlocked" : "";
      return `<button class="choice-btn${unlockedClass}" data-idx="${i}">${c.text}${tag}</button>`;
    }).join("");

  const backHtml = state.noReturnPassed
    ? `<div class="pline" style="padding:0 14px 16px;color:var(--dim);text-align:center;">There's no turning back now.</div>`
    : `<div style="padding:0 14px 16px;"><button class="backbtn" id="locBack">Back</button></div>`;

  el.innerHTML = `
    <div class="topbar">
      <span class="title pixel">${loc.name.toUpperCase()}</span>
      <span class="tracker pixel">${PRESETS[state.character].name.toUpperCase()}</span>
    </div>
    <div class="scene-art">${bgTag(n.background)}</div>
    <div class="dialogue">
      ${portraitHtml}
      <div class="speech">
        <div class="speaker-name ${speakerType}">${n.speaker.name}</div>
        <div class="speech-text">${n.text}</div>
      </div>
    </div>
    <div class="choices">${choicesHtml}</div>
    ${backHtml}
  `;

  el.querySelectorAll(".choice-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const choice = n.choices[+btn.dataset.idx];
      if (choice.skillCheck) openRoll(choice);
      else goToNode(choice.next);
    });
  });
  const locBackBtn = document.getElementById("locBack");
  if (locBackBtn) {
    locBackBtn.addEventListener("click", () => {
      // Steps away mid-scene without marking the adventure complete —
      // unlike the in-story choices, this does NOT touch pr.completed,
      // so the player can come back and try it again later.
      state.locationKey = null; state.node = null;
      state.screen = state.locationReturnTo || "adventureSelect";
      render();
    });
  }
}

/* Enters a location fresh, resetting (or immediately tripping, if the
   start node itself is marked noReturn) the point-of-no-return flag. */
function enterLocation(key, returnTo){
  const loc = getLocation(key);
  state.locationKey = key;
  state.node = loc.start;
  state.locationReturnTo = returnTo;
  state.noReturnPassed = !!(loc.nodes[loc.start] && loc.nodes[loc.start].noReturn);
  // Branches completed THIS visit, so a chainable branch's wrapup can hide
  // itself from the start menu without permanently locking the character
  // out of it on a future visit — resets fresh every time the location opens.
  state.visitedBranches = [];
  state.screen = "location";
  render();
}

function goToNode(nodeId){
  const loc = getLocation(state.locationKey);
  const prevNode = loc.nodes[state.node];
  if (prevNode && prevNode.effect) applyEffect(prevNode.effect);
  // A wrapup node can carry "markVisited": "someKey" to record that this
  // branch is done for the rest of the visit — paired with a matching
  // "branchKey" on the start node's choice for that branch (see
  // meetsChoiceRequirement's sibling filter in renderLocation).
  if (prevNode && prevNode.markVisited && !state.visitedBranches.includes(prevNode.markVisited)){
    state.visitedBranches.push(prevNode.markVisited);
  }

  if (nodeId === "__COMPLETE__"){
    progress[state.character].completed[state.locationKey] = true;
    saveProgress(state.character);
    state.locationKey = null; state.node = null;
    state.screen = state.locationReturnTo || "adventureSelect";
    render();
    return;
  }
  if (nodeId === "__JAIL__"){
    progress[state.character].completed[state.locationKey] = true;
    progress[state.character].jailed = true;
    progress[state.character].jailCount = (progress[state.character].jailCount || 0) + 1;
    progress[state.character].consequences.push("Night in the stocks");
    saveProgress(state.character);
    state.lastJailedLocation = state.locationKey;
    state.locationKey = null; state.node = null;
    state.screen = "jail"; render();
    return;
  }
  state.node = nodeId;
  if (loc.nodes[nodeId] && loc.nodes[nodeId].noReturn) state.noReturnPassed = true;
  // Looping back to the start menu (a chainable branch finishing up) is
  // back to a neutral, uncommitted state — free to leave again from here,
  // same as first walking in.
  if (nodeId === "start") state.noReturnPassed = false;
  render();
}

function applyEffect(effect){
  const pr = progress[state.character];
  const town = getTownForLocation(state.locationKey);
  if (effect.addAlly && !pr.allies.some(a => a.name === effect.addAlly)) pr.allies.push({ name: effect.addAlly, town });
  if (effect.addConsequence) pr.consequences.push(effect.addConsequence);
  if (effect.addItem && !pr.items.some(i => i.name === effect.addItem)) pr.items.push({ name: effect.addItem, town });
  if (effect.removeItem) pr.items = pr.items.filter(i => i.name !== effect.removeItem);
  if (effect.addInfo && !pr.info.some(i => i.name === effect.addInfo)) pr.info.push({ name: effect.addInfo, town });
  if (typeof effect.addGold === "number") pr.gold = pr.gold + effect.addGold;
  saveProgress(state.character);
}

/* ---------- DICE ROLL OVERLAY ---------- */
function openRoll(choice){
  const { skill, dc } = choice.skillCheck;
  const autoMod = (PRESETS[state.character].stats[skill]) || 0;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="roll-card">
      <h3>${PRESETS[state.character].name.toUpperCase()} — ${skill.toUpperCase()} CHECK — DC ${dc}</h3>
      <div class="mod-row">Modifier <input id="modInput" type="number" value="${autoMod}"></div>
      <div class="die" id="dieFace">d20</div>
      <div class="roll-math" id="mathLine">&nbsp;</div>
      <button class="roll-btn" id="rollBtn">ROLL</button>
      <div class="roll-result" id="resultLine"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("rollBtn").addEventListener("click", () => {
    const btn = document.getElementById("rollBtn");
    btn.disabled = true;
    const modifier = parseInt(document.getElementById("modInput").value, 10) || 0;
    const dieFace = document.getElementById("dieFace");
    let ticks = 0;
    const spin = setInterval(() => {
      dieFace.textContent = 1 + Math.floor(Math.random() * 20);
      ticks++;
      if (ticks > 12) {
        clearInterval(spin);
        const roll = 1 + Math.floor(Math.random() * 20);
        dieFace.textContent = roll;
        const total = roll + modifier;
        document.getElementById("mathLine").textContent = `${roll} + ${modifier} = ${total}  (need ${dc})`;
        const result = document.getElementById("resultLine");
        const success = total >= dc;
        result.textContent = success ? "SUCCESS" : "FAILURE";
        result.className = "roll-result " + (success ? "success" : "fail");
        setTimeout(() => {
          document.body.removeChild(overlay);
          goToNode(success ? choice.onSuccess : choice.onFail);
        }, 900);
      }
    }, 60);
  });
}

setupMusicToggle();
render();
initPersistence();

/* ============================================================
   NOTE ON PERSISTENCE
   Progress, party stats, DM-posted adventures, edited built-in
   locations, and the Ship's Log all persist through the "db"
   capability when this page is published with it declared — shared
   across every viewer, on any device, surviving closed tabs and
   reloads. See initPersistence() and the various save-/delete-
   prefixed functions near the top of the script for how. Previewing this file without
   that capability granted (or opening a plain downloaded copy of
   it) falls back to exactly the old behavior: pure in-memory,
   per-tab only, resetting on close — every save call silently
   no-ops rather than erroring.
   ============================================================ */
</script>
</body>
